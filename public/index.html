<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CampusPulse | Campus Helpdesk</title><link rel="stylesheet" href="/styles.css"></head><body><header><a class="brand">Campus<span>Pulse</span></a><small>Campus support, made clearer.</small></header><main><section class="hero"><div><label>STUDENT SUPPORT PORTAL</label><h1>Small issues.<br><em>Better campus days.</em></h1><p>Report a problem, follow its progress, and help keep your campus running.</p></div><b class="mark">CP↗</b></section><section class="stats"><article>All tickets<strong id="totalCount">—</strong></article><article>Open<strong id="openCount">—</strong></article><article>In progress<strong id="progressCount">—</strong></article><article>Resolved<strong id="resolvedCount">—</strong></article></section><div class="layout"><section class="panel"><label>NEW REQUEST</label><h2>Report an issue</h2><form id="ticketForm"><label>Title<input name="title" maxlength="90" required placeholder="Wi-Fi not connecting"></label><div class="pair"><label>Category<select name="category" required><option value="">Select</option><option>Network</option><option>Hardware</option><option>Software</option><option>Facilities</option><option>Other</option></select></label><label>Location<input name="location" required placeholder="IT Lab 2"></label></div><label>Description<textarea name="description" maxlength="600" required rows="4"></textarea></label><label>Name (optional)<input name="reporter" maxlength="60"></label><button>Submit ticket ↗</button><p id="formMessage" role="status"></p></form></section><section class="panel"><label>CAMPUS FEED</label><h2>Recent tickets <small id="ticketCount"></small></h2><div class="filters"><input id="searchInput" placeholder="Search tickets…"><select id="statusFilter"><option>All</option><option>Open</option><option>In Progress</option><option>Resolved</option></select></div><div id="ticketList"></div></section></div><footer>CampusPulse · Student IT project · <span id="year"></span></footer></main><script src="/app.js"></script></body></html>
